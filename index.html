<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        margin:0;
        padding:0;
        box-sizing:border-box;
       }
       .container{
        width:80vw;
        height:80vh;
        background-color:rgb(197, 255, 50); 
        border:5px solid black;
        border-radius:0px;
       }
       .box{
        width:350px;
        height:90px;
        background-color:rgb(213, 24, 24);
        margin:5px;
        padding:10px;
        border-radius:10px;
        position:relative;
        border:5px solid white;
        animation-name:movement;
        animation-duration:5s;  
        animation-iteration-count:infinite;
        animation-delay:0s;
        animation-direction:alternate;
        animation-timing-function:linear;
        
       }
       @keyframes movement {
        from{
            top:0;
            left:0;
        }
        to{
            top:0px;
            left:675px;
            background-color:rgb(131, 30, 209);
            border:5px solid black;
        }
       
       }
       .boxy{
        width:350px;
        height:90px;
        background-color:rgb(68, 208, 233);
        border:5px solid black;
        margin:5px;
        padding:10px;
        border-radius:10px;
        position:relative;
        animation-name:move;
        animation-duration:5s;  
        animation-iteration-count:infinite;
        animation-delay:0s;
        animation-direction:alternate;
        animation-timing-function:linear;


       }
       @keyframes move {
        from{
            top:330px;
            left:650px;
        }
        to{
            top:330px;
            left:0px;
            background-color:rgb(34, 212, 72);
            border:5px solid white;
        }
       }
       .circle{
        width:50px;
        height:50px;
        background-color:rgb(142, 94, 191);
        border:3px solid black;
        border-radius:100%;
        position:absolute;
        
        margin:5px;
        animation-name:connect;
        animation-duration:10s;
        animation-iteration-count:infinite;
        animation-delay:0s;
        animation-timing-function:linear;
       }
       @keyframes connect {
        0%{
            top:95px;
            left:10px;
            background-color:rgb(93, 219, 58);
        }
        25%{
            top:380px;
            left:460px;
            background-color:rgb(219, 93, 58);
        }
        50%{
            top:95px;
            left:980px;
            background-color:rgb(58, 93, 219);
        }
        75%{
            top:380px;
            left:460px;
            background-color:rgb(219, 93, 58);

        }
        100%{
            top:95px;
            left:10px;
            background-color:rgb(93, 219, 58);
        }
       }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>

        <div class="boxy">

        </div>
        <div
            class="circle"></div>
        </div>
    </div>    
</body>
</html>
